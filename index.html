<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O programie</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .about-box {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 24px;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .app-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .app-version {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 14px;
    }

    .app-url a {
      font-size: 0.9rem;
      color: #2563eb;
      text-decoration: underline;
    }

    .app-url a:hover {
      color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="about-box">
    <div class="app-name">[Nowa Nazwa Aplikacji]</div>
    <div class="app-version">Wersja 1.0</div>
    <div class="app-url">
      <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">https://www.example.com</a>
    </div>
  </div>

</body>
</html>
